name: Restore art
on:
  push:
    paths:
      - ".github/workflows/restore-art.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode ruleset art
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for path in Path(".").rglob("*.webp.b64"):
              if ".part" in path.name:
                  continue
              target = Path(str(path)[:-4])
              target.write_bytes(base64.b64decode(path.read_text(encoding="ascii")))
              path.unlink()
          groups = {}
          for path in Path(".").rglob("*.webp.b64.part*"):
              key = str(path).rsplit(".part", 1)[0]
              groups.setdefault(key, []).append(path)
          for key, parts in groups.items():
              parts.sort()
              data = b"".join(base64.b64decode(part.read_text(encoding="ascii")) for part in parts)
              Path(key[:-4]).write_bytes(data)
              for part in parts:
                  part.unlink()
          workflow = Path(".github/workflows/restore-art.yml")
          if workflow.exists():
              workflow.unlink()
          PY
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "The Kraken"
          git config user.email "krakenunbound@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add ruleset art"
          git push
